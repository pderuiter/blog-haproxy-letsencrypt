---
# Certificates to request, as in setup-haproxy-letsencrypt.sh: one lineage per
# entry, stored in /etc/haproxy/certs/<name>.pem. The names must resolve to this
# host and port 80 must be reachable from the internet (HTTP-01).
haproxy_letsencrypt_certificates:
  - {name: example.com, domains: [example.com, www.example.com]}
  - {name: api.example.com, domains: [api.example.com]}
  - {name: app.example.com, domains: [app.example.com]}
haproxy_letsencrypt_email: admin@example.com

# ACME directory. Empty: Let's Encrypt production. For tests use the staging
# directory https://acme-staging-v02.api.letsencrypt.org/directory
haproxy_letsencrypt_acme_server: ""

# Paths from the post
haproxy_letsencrypt_cert_dir: /etc/haproxy/certs
haproxy_letsencrypt_webroot: /var/www/letsencrypt
haproxy_letsencrypt_acme_port: 8080
haproxy_letsencrypt_deploy_hook: /etc/letsencrypt/renewal-hooks/deploy/haproxy.sh

# Stats page (the post uses admin:changeme; set the password in vault.yml)
haproxy_letsencrypt_stats_user: admin
haproxy_letsencrypt_stats_password: "{{ vault_haproxy_letsencrypt_stats_password }}"

# Host-based routing of the complete production setup
haproxy_letsencrypt_api_host: api.example.com
haproxy_letsencrypt_app_host: app.example.com
haproxy_letsencrypt_web_servers:
  - {name: web1, address: 192.168.1.10, port: 8080}
  - {name: web2, address: 192.168.1.11, port: 8080}
haproxy_letsencrypt_api_servers:
  - {name: api1, address: 192.168.1.20, port: 8080}
  - {name: api2, address: 192.168.1.21, port: 8080}
haproxy_letsencrypt_app_servers:
  - {name: app1, address: 192.168.1.30, port: 8080}
  - {name: app2, address: 192.168.1.31, port: 8080}
