---
- name: Load the OS specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install EPEL (certbot comes from EPEL on RHEL)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install certbot, socat and python3
  ansible.builtin.package:
    name:
      - certbot
      - socat
      - python3
    state: present

# ACME challenge server (setup-haproxy-letsencrypt.sh in the post)
- name: Create the challenge directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ _haproxy_letsencrypt_web_user }}"
    group: "{{ _haproxy_letsencrypt_web_user }}"
    mode: "0755"
  loop:
    - "{{ haproxy_letsencrypt_webroot }}"
    - "{{ haproxy_letsencrypt_webroot }}/.well-known"
    - "{{ haproxy_letsencrypt_webroot }}/.well-known/acme-challenge"

- name: Install the ACME challenge server unit
  ansible.builtin.template:
    src: acme-challenge.service.j2
    dest: /etc/systemd/system/acme-challenge.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart acme-challenge

- name: Enable and start the ACME challenge server
  ansible.builtin.systemd_service:
    name: acme-challenge
    enabled: true
    state: started
    daemon_reload: true

# Deploy hook: runtime API update, reload as fallback (Method 3 in the post)
- name: Create the certbot deploy hook directory
  ansible.builtin.file:
    path: "{{ haproxy_letsencrypt_deploy_hook | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the deploy hook
  ansible.builtin.copy:
    src: haproxy-deploy-hook.sh
    dest: "{{ haproxy_letsencrypt_deploy_hook }}"
    owner: root
    group: root
    mode: "0755"

- name: Request the certificates and start HAProxy
  ansible.builtin.import_tasks: certificates.yml

# Automated renewal: the post's systemd timer
- name: Install the certbot-renewal service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - certbot-renewal.service
    - certbot-renewal.timer

- name: Enable and start certbot-renewal.timer
  ansible.builtin.systemd_service:
    name: certbot-renewal.timer
    enabled: true
    state: started
    daemon_reload: true
